<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الأسئلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1b2a41;--mut:#5c6b80;--ac:#0f766e;--ac2:#e0a100;--ok:#15803d;--bad:#b91c1c;--line:#d9d2c0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12202e;--card:#1b2d40;--ink:#f3efe6;--mut:#9fb0c3;--ac:#2dd4bf;--ac2:#fbbf24;--ok:#4ade80;--bad:#f87171;--line:#2f4660}}
:root[data-theme="dark"]{--bg:#12202e;--card:#1b2d40;--ink:#f3efe6;--mut:#9fb0c3;--ac:#2dd4bf;--ac2:#fbbf24;--ok:#4ade80;--bad:#f87171;--line:#2f4660}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;max-width:520px;width:100%;padding:28px 22px;text-align:center}
h1{font-size:2rem;font-weight:900;margin:8px 0}
p{color:var(--mut);line-height:1.8;margin:6px 0 18px}
button{font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;width:100%;color:var(--ink)}
button:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.main{background:var(--ac);color:#fff}
:root[data-theme="dark"] .main{color:#0b1b26}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .main{color:#0b1b26}}
.ghost{background:transparent;border:2px solid var(--line);margin-top:10px}
.face{width:84px;height:84px;margin:0 auto 6px;display:block}
.opt{display:block;background:transparent;border:2px solid var(--line);margin:10px 0;text-align:right}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac2);width:0;transition:width .3s}
.q{font-size:1.3rem;font-weight:700;line-height:1.7;margin:0 0 10px}
.meta{color:var(--mut);font-size:.9rem;margin-bottom:8px}
.err{color:var(--bad);font-size:.95rem;min-height:1.4em}
.score{font-size:3.4rem;font-weight:900;color:var(--ac)}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:150px;overflow:auto;margin:8px 0}
.chip{background:color-mix(in srgb,var(--ok) 18%,transparent);border:1px solid var(--ok);border-radius:20px;padding:3px 12px;font-size:.9rem}
.pod{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:14px 0}
.pod div{flex:1;border-radius:12px 12px 0 0;padding:10px 4px;background:var(--line);font-weight:700;word-break:break-word}
.pod .r1{background:var(--ac2);color:#1b2a41;height:130px}.pod .r2{height:100px}.pod .r3{height:80px}
.pod small{display:block;font-weight:400}
.list{max-height:220px;overflow:auto;text-align:right;border-top:2px solid var(--line);margin-top:8px}
.list div{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--line)}
input{font-family:inherit;font-size:1.05rem;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);margin-bottom:10px;text-align:center}
.scan{position:relative;width:130px;height:130px;margin:10px auto;overflow:hidden;border-radius:24px}
.scan svg{width:100%;height:100%}
.scan i{position:absolute;left:8%;right:8%;top:0;height:4px;border-radius:4px;background:var(--ac2);box-shadow:0 0 14px var(--ac2);animation:sc 1.1s ease-in-out infinite alternate}
.scan.done i{display:none}.scan.done svg{stroke:var(--ok)}.scan.done svg [fill]{fill:var(--ok)}
@keyframes sc{to{top:calc(100% - 4px)}}
@media (prefers-reduced-motion:reduce){.scan i{animation:none;top:50%}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ========== 1) الصقي إعدادات Firebase هنا ========== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDTDnEG7s67ABRNphlYQll9VvW2dDMjcUM",
  authDomain:"questions-dbdab.firebaseapp.com",
  databaseURL:"https://questions-dbdab-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"questions-dbdab",
  appId:"1:492882535543:web:3a98d69d70999560145272"
};
/* ========== 2) كود دخول المقدّم (غيّريه) ========== */
const HOST_PIN="1234";
/* ========== 3) الأسئلة ========== */
const Q=[
 {q:"ما هي عاصمة مصر؟",o:["الإسكندرية","القاهرة","الجيزة","أسوان"],a:1},
 {q:"كم عدد أيام الأسبوع؟",o:["5","6","7","8"],a:2},
 {q:"ما هو أكبر كوكب في المجموعة الشمسية؟",o:["الأرض","المريخ","زحل","المشتري"],a:3},
 {q:"أي نهر يمر في مصر؟",o:["نهر النيل","نهر الأمازون","نهر الراين","نهر الدانوب"],a:0},
 {q:"كم عدد ألوان قوس قزح؟",o:["5","7","9","12"],a:1}
];
/* ================================================== */
const app=document.getElementById('app');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let db,uid,isHost=false,hostOk=false,preview=false,joined=false,state={phase:'lobby',q:0,t:0},players=[],myAns={},myName=ls.get('pname')||'',qKey='',qStart=0,wrote=false,loginErr='';

const pts=p=>Object.entries(p.answers||{}).reduce((s,[k,a])=>{const q=Q[+k.slice(1)];return s+(q&&a.c===q.a?1000+Math.max(0,Math.round(500*(1-a.ms/20000))):0)},0);
const ranked=()=>players.map(p=>({...p,pts:pts(p)})).sort((a,b)=>b.pts-a.pts);
const podium=r=>`<div class="pod">${[1,0,2].map(i=>r[i]?`<div class="r${i+1}">${i+1}<br>${esc(r[i].name)}<small>${r[i].pts} نقطة</small></div>`:'').join('')}</div>`;
const fullList=r=>`<div class="list">${r.map((p,i)=>`<div><span>${i+1}. ${esc(p.name)}</span><b>${p.pts}</b></div>`).join('')}</div>`;
const ansNow=p=>p.answers&&p.answers['q'+state.q];
const correctNow=()=>players.filter(p=>{const a=ansNow(p);return a&&a.c===Q[state.q].a});
const answeredNow=()=>players.filter(ansNow);

function render(){
 if(isHost&&!preview) return renderHost();
 if(!joined) return renderLogin();
 const r=ranked(),myRank=r.findIndex(p=>p.id===uid)+1,q=Q[state.q],k='q'+state.q;
 if(state.phase==='lobby'){
  if(!players.find(p=>p.id===uid)&&!wrote){wrote=true;myAns={};save();}
  app.innerHTML=`<h1>أهلاً ${esc(myName)}</h1><p>اتسجلت في اللعبة. استنى لحد ما المقدّم يبدأ.</p>${isHost?'<button class="ghost" id="bk">رجوع لشاشة المقدّم</button>':''}`;
  const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{db.ref('players/'+uid).remove();preview=false;joined=false;wrote=false;render();};
 }else if(state.phase==='question'){
  wrote=false;
  const key=state.q+'-'+state.t;if(key!==qKey){qKey=key;qStart=Date.now();}
  if(myAns[k]) app.innerHTML=`<p class="meta">سؤال ${state.q+1} من ${Q.length}</p><h2 class="q">تم تسجيل إجابتك</h2><p>استنى النتيجة على الشاشة.</p>`;
  else{
   app.innerHTML=`<p class="meta">سؤال ${state.q+1} من ${Q.length} - كل ما جاوبت أسرع، نقاطك أكتر</p><h2 class="q">${esc(q.q)}</h2>`+q.o.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join('');
   app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(myAns[k])return;myAns[k]={c:+b.dataset.i,ms:Date.now()-qStart};save();render();});
  }
 }else if(state.phase==='reveal'){
  const a=myAns[k],ok=a&&a.c===q.a;
  app.innerHTML=`<h1 style="color:var(--${ok?'ok':'bad'})">${ok?'إجابتك صح':a?'إجابتك غلط':'ماجاوبتش'}</h1><p>الإجابة الصح: ${esc(q.o[q.a])}</p><p>ترتيبك دلوقتي: <b>${myRank}</b> من ${r.length}</p>`;
 }else{
  app.innerHTML=`<p>ترتيبك النهائي</p><div class="score">${myRank}</div><p>من ${r.length} لاعب</p>${podium(r)}`;
 }
}

function renderHost(){
 const r=ranked(),q=Q[state.q],ph=state.phase,n=players.length;
 let h=`<p class="meta">شاشة المقدّم - ${n} لاعب</p>`;
 if(ph==='lobby') h+=`<h1>لعبة الأسئلة</h1><p>اللاعبين المتسجلين: <b>${n}</b></p><div class="chips">${players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div><button class="main" id="go">ابدأ السؤال 1</button><button class="ghost" id="pv">جرّب شاشة اللاعب (مسح الوجه)</button>`;
 if(ph==='question') h+=`<p class="meta">سؤال ${state.q+1} من ${Q.length}</p><h2 class="q">${esc(q.q)}</h2>${q.o.map(t=>`<div class="opt">${esc(t)}</div>`).join('')}<p>جاوب <b>${answeredNow().length}</b> من ${n}</p><button class="main" id="go">اظهر الإجابة</button>`;
 if(ph==='reveal'){const c=correctNow();h+=`<h2 class="q">${esc(q.q)}</h2><p>الإجابة الصح: <b style="color:var(--ok)">${esc(q.o[q.a])}</b></p><p>جاوب صح: <b>${c.length}</b> من ${n}</p><div class="chips">${c.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div><p class="meta">أعلى 3 دلوقتي</p>${podium(r)}${fullList(r)}<button class="main" id="go">${state.q<Q.length-1?'السؤال التالي':'النتيجة النهائية'}</button>`;}
 if(ph==='final') h+=`<h1>الفايزين</h1>${podium(r)}${fullList(r)}<button class="ghost" id="go">لعبة جديدة</button>`;
 app.innerHTML=h;
 const pv=document.getElementById('pv');if(pv)pv.onclick=()=>{preview=true;joined=false;render();};
 const go=document.getElementById('go');
 if(go) go.onclick=async()=>{
  const set=(phase,q)=>db.ref('game/state').set({phase,q,t:Date.now()});
  if(ph==='lobby') await set('question',0);
  else if(ph==='question') await set('reveal',state.q);
  else if(ph==='reveal') await (state.q<Q.length-1?set('question',state.q+1):set('final',state.q));
  else {await db.ref('players').remove();await set('lobby',0);}
 };
}

function renderLogin(){
 app.innerHTML=`<svg class="face" viewBox="0 0 64 64" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M8 22V12a4 4 0 014-4h10M42 8h10a4 4 0 014 4v10M56 42v10a4 4 0 01-4 4H42M22 56H12a4 4 0 01-4-4V42"/><path d="M24 25v5M40 25v5M32 27v8h-3M24 43c5 4 11 4 16 0"/></svg><h1>لعبة الأسئلة</h1><p>اكتب اسمك واعمل مسح للوجه عشان تدخل.</p><input id="nm" placeholder="اسمك" maxlength="20" value="${esc(myName)}"><button class="main" id="fb">الدخول بـ Face ID</button><div class="err" role="alert">${esc(loginErr)}</div>`;
 document.getElementById('fb').onclick=()=>{
  myName=document.getElementById('nm').value.trim();
  if(!myName){loginErr='اكتب اسمك الأول.';return renderLogin();}
  ls.set('pname',myName);
  app.innerHTML=`<div class="scan"><svg viewBox="0 0 64 64" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M8 22V12a4 4 0 014-4h10M42 8h10a4 4 0 014 4v10M56 42v10a4 4 0 01-4 4H42M22 56H12a4 4 0 01-4-4V42"/><path d="M24 25v5M40 25v5M32 27v8h-3M24 43c5 4 11 4 16 0"/></svg><i></i></div><h1 id="st">جاري المسح...</h1><p>${esc(myName)}</p>`;
  setTimeout(()=>{document.getElementById('st').textContent='تم التعرف على الوجه';document.querySelector('.scan').classList.add('done');},1800);
  setTimeout(()=>{joined=true;render();},2600);
 };
}
function save(){db.ref('players/'+uid).set({name:myName,answers:myAns}).catch(()=>{});}

function hostLogin(){
 app.innerHTML=`<h1>دخول المقدّم</h1><p>اكتب الكود السري.</p><input id="pin" type="password" inputmode="numeric" placeholder="الكود"><button class="main" id="ok">دخول</button><div class="err" role="alert"></div>`;
 document.getElementById('ok').onclick=()=>{
  if(document.getElementById('pin').value===HOST_PIN){hostOk=true;begin();}
  else document.querySelector('.err').textContent='الكود غلط.';
 };
}
function begin(){
 db.ref('game/state').on('value',s=>{state=s.val()||{phase:'lobby',q:0,t:0};render();});
 db.ref('players').on('value',s=>{const v=s.val()||{};players=Object.entries(v).map(([id,d])=>({id,name:d.name,answers:d.answers||{}}));render();});
 render();
}
function init(){
 if(String(FIREBASE_CONFIG.databaseURL).includes('PASTE')){app.innerHTML='<h1>الإعداد ناقص</h1><p>الصقي إعدادات Firebase في أول الملف.</p>';return;}
 try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();}
 catch(e){app.innerHTML='<h1>خطأ في الإعداد</h1><p>راجعي إعدادات Firebase.</p>';return;}
 uid=ls.get('uid')||('p'+Math.random().toString(36).slice(2,10));ls.set('uid',uid);
 isHost=/[?&]host\b/.test(location.search);
 if(isHost){hostLogin();return;}
 begin();
}
init();
</script>
</body>
</html>
